    .icon-grid {

    .icon-button {

      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    /* Skeuomorphic styles */
    .icon-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
      z-index: 1;
    }

    .icon-button::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, transparent 40%, rgba(0,0,0,0.2) 100%);
      z-index: 1;
    }

    .icon-button svg {
      position: relative;
      z-index: 2;
      width: 40px;
      height: 40px;
      transition: transform 0.2s ease;

    }

    .icon-button:hover svg {

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H;

    const blobs = [
      { x: 0, y: 0, r: 280, vx: 0.3, vy: 0.2, color: '110,64,201' },
      { x: 0, y: 0, r: 260, vx: -0.25, vy: 0.35, color: '31,111,235' },
      { x: 0, y: 0, r: 220, vx: 0.2, vy: -0.3, color: '56,139,253' },
      { x: 0, y: 0, r: 200, vx: -0.35, vy: -0.2, color: '88,166,255' },
      { x: 0, y: 0, r: 180, vx: 0.15, vy: 0.4, color: '100,50,220' },
    ];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      blobs.forEach((b, i) => {
        if (!b.initialized) {
          b.x = Math.random() * W;
          b.y = Math.random() * H;
          b.initialized = true;
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, W, H);

      for (const b of blobs) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, `rgba(${b.color},0.22)`);
        grad.addColorStop(1, `rgba(${b.color},0)`);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -b.r) b.x = W + b.r;
        if (b.x > W + b.r) b.x = -b.r;
        if (b.y < -b.r) b.y = H + b.r;
        if (b.y > H + b.r) b.y = -b.r;
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
